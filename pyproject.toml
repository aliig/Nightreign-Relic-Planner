[project]
name = "nrplanner"
version = "0.1.0"
description = "Nightreign relic build optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.3",
    "lxml>=6.0.2",
    "orjson>=3.11.5",
    "pandas>=2.3.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Rust solver.  Optional only for the duration of the migration, so
# `uv sync` still works on a machine without a Rust toolchain; it becomes a
# hard dependency at switchover.
rust = ["nrplanner-core"]

[tool.uv.workspace]
members = ["backend", "crates/nrplanner_core"]

[tool.uv.sources]
nrplanner-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "coverage>=7.4.3",
    # `uv run maturin develop --release -m crates/nrplanner_core/Cargo.toml`
    "maturin>=1.8,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# nrplanner package lives at the repo root, not in src/
where = ["."]
include = ["nrplanner*"]

[tool.pytest.ini_options]
testpaths = ["nrplanner/tests"]
markers = [
    "integration: real external data or filesystem required",
    "slow: long-running exhaustive searches (brute-force oracles, benchmarks)",
]
